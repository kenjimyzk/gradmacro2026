<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">第7回講義の全体像</title>
  <desc id="desc">テイラー・ルールが設定する名目利子率と期待インフレ率から実質利子率が決まる。動学的IS曲線では実質利子率と自然利子率の差が需給ギャップを動かし、実質限界費用を通じてインフレ率に波及する。当期インフレ率はテイラー・ルールにも入る。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526070"/>
    </marker>
    <marker id="feedback-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fbe"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1120" height="650" fill="#ffffff"/>
  <rect x="50" y="40" width="1020" height="560" rx="18" fill="#f8fafc" stroke="#d9e0ea"/>

  <g font-family="Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif">
    <text x="80" y="86" font-size="32" font-weight="700" fill="#1f2937">第7回の地図：価格硬直性とNK方程式</text>
    <text x="80" y="119" font-size="19" fill="#566273">実質利子率と自然利子率の差が、需給ギャップ、限界費用、インフレ率へ波及する</text>
  </g>

  <g stroke="#526070" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M 340 220 H 390"/>
    <path d="M 650 280 V 315 Q 650 330 665 330 H 845 Q 860 330 860 345 V 380"/>
    <path d="M 965 280 V 380"/>
    <path d="M 780 455 H 730"/>
    <path d="M 390 455 H 340"/>
  </g>
  <path d="M 192 380 V 280" stroke="#2f6fbe" stroke-width="3" stroke-dasharray="6 5" fill="none" marker-end="url(#feedback-arrow)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="160" width="260" height="120" rx="12" fill="#edf6f8" stroke="#27899a" stroke-width="2"/>
    <rect x="390" y="160" width="340" height="120" rx="12" fill="#f6edf9" stroke="#8d5ab8" stroke-width="2"/>
    <rect x="780" y="160" width="260" height="120" rx="12" fill="#fff3e8" stroke="#d9792f" stroke-width="2"/>
    <rect x="80" y="380" width="260" height="145" rx="12" fill="#eef8ef" stroke="#379b55" stroke-width="2"/>
    <rect x="390" y="380" width="340" height="145" rx="12" fill="#f2f4f8" stroke="#697386" stroke-width="2"/>
    <rect x="780" y="380" width="260" height="145" rx="12" fill="#eaf2ff" stroke="#2f6fbe" stroke-width="2"/>
  </g>

  <g font-family="Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17" fill="#20242a">
    <text x="105" y="196" font-size="22" font-weight="700">テイラー・ルール</text>
    <text x="105" y="226">名目利子率を設定</text>
    <text x="105" y="256">r<tspan baseline-shift="sub" font-size="12">t</tspan><tspan baseline-shift="super" font-size="12">N</tspan> = φπ<tspan baseline-shift="sub" font-size="12">t</tspan> − m<tspan baseline-shift="sub" font-size="12">t</tspan></text>

    <text x="415" y="196" font-size="22" font-weight="700">フィッシャー方程式</text>
    <text x="415" y="226">事前実質利子率</text>
    <text x="415" y="256">r<tspan baseline-shift="sub" font-size="12">t</tspan> = r<tspan baseline-shift="sub" font-size="12">t</tspan><tspan baseline-shift="super" font-size="12">N</tspan> − 𝔼<tspan baseline-shift="sub" font-size="12">t</tspan>π<tspan baseline-shift="sub" font-size="12">t+1</tspan></text>

    <text x="805" y="196" font-size="22" font-weight="700">自然水準</text>
    <text x="805" y="226">柔軟価格での自然産出量 y<tspan baseline-shift="sub" font-size="12">t</tspan><tspan baseline-shift="super" font-size="12">f</tspan></text>
    <text x="805" y="256">と自然利子率 r<tspan baseline-shift="sub" font-size="12">t</tspan><tspan baseline-shift="super" font-size="12">f</tspan></text>

    <text x="208" y="333" font-size="16" fill="#2f6fbe">当期インフレ率への反応</text>

    <text x="105" y="417" font-size="22" font-weight="700">インフレ率</text>
    <text x="105" y="449">NKフィリップス曲線</text>
    <text x="105" y="483">π<tspan baseline-shift="sub" font-size="12">t</tspan> = β𝔼<tspan baseline-shift="sub" font-size="12">t</tspan>π<tspan baseline-shift="sub" font-size="12">t+1</tspan> + κ<tspan baseline-shift="sub" font-size="12">p</tspan>&#160;mc<tspan baseline-shift="sub" font-size="12">t</tspan></text>

    <text x="415" y="417" font-size="22" font-weight="700">需給ギャップと実質限界費用</text>
    <text x="415" y="451">x<tspan baseline-shift="sub" font-size="12">t</tspan> = y<tspan baseline-shift="sub" font-size="12">t</tspan> − y<tspan baseline-shift="sub" font-size="12">t</tspan><tspan baseline-shift="super" font-size="12">f</tspan></text>
    <text x="415" y="483">mc<tspan baseline-shift="sub" font-size="12">t</tspan> = (γ + ϕ)x<tspan baseline-shift="sub" font-size="12">t</tspan></text>

    <text x="805" y="417" font-size="22" font-weight="700">動学的 IS 曲線</text>
    <text x="805" y="449">実質金利ギャップと需要</text>
    <text x="805" y="483">x<tspan baseline-shift="sub" font-size="12">t</tspan> = 𝔼<tspan baseline-shift="sub" font-size="12">t</tspan>x<tspan baseline-shift="sub" font-size="12">t+1</tspan> − (r<tspan baseline-shift="sub" font-size="12">t</tspan> − r<tspan baseline-shift="sub" font-size="12">t</tspan><tspan baseline-shift="super" font-size="12">f</tspan>) / γ</text>
  </g>
</svg>
