<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">第10回講義の全体像</title>
  <desc id="desc">価格硬直性RANKモデルに労働パッカーと賃金硬直性を加え、価格フィリップス曲線と賃金フィリップス曲線を導く流れ。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#34495e"/>
    </marker>
    <style>
      .bg { fill: #f7f9fb; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2d3d; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #52616f; }
      .box { fill: #ffffff; stroke: #9fb3c8; stroke-width: 2; rx: 8; }
      .box-blue { fill: #eaf3ff; stroke: #4f8fcf; }
      .box-green { fill: #edf8f0; stroke: #4c9f70; }
      .box-amber { fill: #fff6df; stroke: #c9972d; }
      .box-red { fill: #fff0ef; stroke: #ce6a63; }
      .label { font: 700 22px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #233142; }
      .text { font: 400 18px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #34495e; }
      .math { font: 600 21px "Times New Roman", "STIX Two Text", serif; fill: #233142; }
      .math-small { font: 600 19px "Times New Roman", "STIX Two Text", serif; fill: #233142; }
      .note { font: 400 16px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #52616f; }
      .arrow { stroke: #34495e; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #6c7a89; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="590"/>
  <text class="title" x="48" y="54">第10回：価格・賃金硬直性をもつRANKモデル</text>
  <text class="subtitle" x="50" y="84">第7回の価格硬直性モデルに、労働パッカーと賃金フィリップス曲線を追加する</text>

  <rect class="box box-blue" x="58" y="138" width="245" height="150"/>
  <text class="label" x="82" y="176">第7回の土台</text>
  <text class="text" x="82" y="208">価格硬直性</text>
  <text class="text" x="82" y="235">RANK, α = 0</text>
  <text class="math-small" x="82" y="260">π<tspan baseline-shift="super" font-size="13">p</tspan><tspan baseline-shift="sub" font-size="13">t</tspan> = β E<tspan baseline-shift="sub" font-size="13">t</tspan>π<tspan baseline-shift="super" font-size="13">p</tspan><tspan baseline-shift="sub" font-size="13">t+1</tspan></text>
  <text class="math-small" x="82" y="282">+ κ<tspan baseline-shift="sub" font-size="13">p</tspan> mc<tspan baseline-shift="sub" font-size="13">t</tspan></text>

  <rect class="box box-green" x="360" y="138" width="245" height="150"/>
  <text class="label" x="384" y="176">労働パッカー</text>
  <text class="text" x="384" y="208">差別化労働を集計</text>
  <text class="text" x="384" y="235">賃金が需要を動かす</text>
  <text class="math-small" x="384" y="260">N<tspan baseline-shift="sub" font-size="13">t</tspan>(h) = N<tspan baseline-shift="sub" font-size="13">t</tspan></text>
  <text class="math-small" x="384" y="282">[W<tspan baseline-shift="sub" font-size="13">t</tspan>(h)/W<tspan baseline-shift="sub" font-size="13">t</tspan>]<tspan baseline-shift="super" font-size="13">−ψ</tspan><tspan baseline-shift="sub" font-size="12">w</tspan></text>

  <rect class="box box-amber" x="662" y="138" width="245" height="150"/>
  <text class="label" x="686" y="176">賃金硬直性</text>
  <text class="text" x="686" y="208">名目賃金の調整費用</text>
  <text class="text" x="686" y="235">賃金マークアップ</text>
  <text class="math-small" x="686" y="260">π<tspan baseline-shift="super" font-size="13">w</tspan><tspan baseline-shift="sub" font-size="13">t</tspan> = β E<tspan baseline-shift="sub" font-size="13">t</tspan>π<tspan baseline-shift="super" font-size="13">w</tspan><tspan baseline-shift="sub" font-size="13">t+1</tspan></text>
  <text class="math-small" x="686" y="282">− κ<tspan baseline-shift="sub" font-size="13">w</tspan> μ<tspan baseline-shift="super" font-size="13">w</tspan><tspan baseline-shift="sub" font-size="13">t</tspan></text>

  <rect class="box box-red" x="964" y="138" width="180" height="150"/>
  <text class="label" x="988" y="176">政策問題</text>
  <text class="text" x="988" y="208">価格インフレ</text>
  <text class="text" x="988" y="234">賃金インフレ</text>
  <text class="text" x="988" y="258">需給ギャップ</text>

  <path class="arrow" d="M303 213 H352"/>
  <path class="arrow" d="M605 213 H654"/>
  <path class="arrow" d="M907 213 H956"/>

  <rect class="box" x="148" y="368" width="904" height="148"/>
  <text class="label" x="180" y="408">中心となる整理式</text>
  <text class="math" x="180" y="448">μ<tspan baseline-shift="super" font-size="14">p</tspan><tspan baseline-shift="sub" font-size="14">t</tspan> + μ<tspan baseline-shift="super" font-size="14">w</tspan><tspan baseline-shift="sub" font-size="14">t</tspan> = −(γ + ϕ)x<tspan baseline-shift="sub" font-size="14">t</tspan></text>
  <text class="text" x="500" y="448">2つのマークアップの合計が需給ギャップを表す</text>
  <text class="math" x="180" y="484">π<tspan baseline-shift="super" font-size="14">w</tspan><tspan baseline-shift="sub" font-size="14">t</tspan> − π<tspan baseline-shift="super" font-size="14">p</tspan><tspan baseline-shift="sub" font-size="14">t</tspan> = Δw<tspan baseline-shift="sub" font-size="14">t</tspan></text>
  <text class="text" x="500" y="484">2つのインフレ率の差が実質賃金を動かす</text>
  <text class="note" x="180" y="545">ϕ はフリッシュ弾力性の逆数（テイラー係数とは別）</text>

  <path class="thin" d="M180 288 C210 325, 270 345, 360 368"/>
  <path class="thin" d="M482 288 V360"/>
  <path class="thin" d="M785 288 C760 328, 720 347, 675 368"/>
  <path class="thin" d="M1054 288 C1025 330, 960 352, 890 368"/>
</svg>
