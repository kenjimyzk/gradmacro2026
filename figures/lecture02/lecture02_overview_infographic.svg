<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">第2回講義の全体像</title>
  <desc id="desc">時系列分析、ショックの波及、安定性、対数線形近似がDSGEモデルの分析につながる流れを示す。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#536171"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1100" height="640" fill="#ffffff"/>
  <rect x="50" y="40" width="1000" height="550" rx="18" fill="#f8fafc" stroke="#d9e0ea"/>
  <g font-family="Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif">
    <text x="80" y="86" font-size="32" font-weight="700" fill="#1f2937">第2回の地図：DSGEの動学を読む準備</text>
    <text x="80" y="119" font-size="19" fill="#566273">ショックがどれだけ残るか、モデルをどう線形化して読むかを学ぶ</text>
  </g>
  <g stroke="#536171" stroke-width="3" stroke-linejoin="round" fill="none" marker-end="url(#arrow)">
    <path d="M 258 236 L 338 236"/>
    <path d="M 516 236 L 596 236"/>
    <path d="M 774 236 L 854 236"/>
    <path d="M 943 310 L 943 356 L 338 356 L 338 410"/>
    <path d="M 450 473 L 650 473"/>
  </g>
  <g font-family="Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif" filter="url(#shadow)">
    <rect x="80" y="160" width="178" height="150" rx="12" fill="#eaf2ff" stroke="#2f6fbe" stroke-width="2"/>
    <rect x="338" y="160" width="178" height="150" rx="12" fill="#eef8ef" stroke="#379b55" stroke-width="2"/>
    <rect x="596" y="160" width="178" height="150" rx="12" fill="#fff3e8" stroke="#d9792f" stroke-width="2"/>
    <rect x="854" y="160" width="178" height="150" rx="12" fill="#f6edf9" stroke="#8d5ab8" stroke-width="2"/>
    <rect x="226" y="410" width="224" height="126" rx="12" fill="#edf6f8" stroke="#27899a" stroke-width="2"/>
    <rect x="650" y="410" width="224" height="126" rx="12" fill="#f2f4f8" stroke="#697386" stroke-width="2"/>
  </g>
  <g font-family="Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif" fill="#20242a">
    <text x="96" y="198" font-size="23" font-weight="700">時系列データ</text>
    <text x="96" y="228" font-size="17">水準・乖離・成長率</text>
    <text x="96" y="253" font-size="17">平均と分散</text>
    <text x="96" y="278" font-size="17">ラグの相関</text>
    <text x="354" y="198" font-size="23" font-weight="700">定常性</text>
    <text x="354" y="228" font-size="17">平均・分散が一定</text>
    <text x="354" y="253" font-size="17">共分散はラグ依存</text>
    <text x="354" y="278" font-size="17">時点に依存しない</text>
    <text x="612" y="198" font-size="23" font-weight="700">AR(1)</text>
    <text x="612" y="228" font-size="17">持続性 ρ</text>
    <text x="612" y="253" font-size="17">半減期</text>
    <text x="612" y="278" font-size="17">ショック過程</text>
    <text x="870" y="198" font-size="23" font-weight="700">IRF</text>
    <text x="870" y="228" font-size="17">ショックの波及</text>
    <text x="870" y="253" font-size="17">ρᵗ で減衰</text>
    <text x="870" y="278" font-size="17">政策効果の形</text>
    <text x="242" y="448" font-size="23" font-weight="700">状態空間</text>
    <text x="242" y="478" font-size="17"><tspan font-style="italic">s</tspan><tspan baseline-shift="sub" font-size="12">t+1</tspan><tspan> = A</tspan><tspan font-style="italic">s</tspan><tspan baseline-shift="sub" font-size="12">t</tspan><tspan> + Bε</tspan><tspan baseline-shift="sub" font-size="12">t+1</tspan></text>
    <text x="242" y="503" font-size="17">固有値で安定性を読む</text>
    <text x="666" y="448" font-size="23" font-weight="700">対数線形近似</text>
    <text x="666" y="478" font-size="17">非線形条件を線形化</text>
    <text x="666" y="503" font-size="17">第4回以降のDSGE分析へ</text>
  </g>
</svg>
