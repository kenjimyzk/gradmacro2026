<svg xmlns="http://www.w3.org/2000/svg" width="920" height="920" viewBox="0 0 920 920" role="img" aria-labelledby="title desc">
  <title id="title">ケインジアン・クロス</title>
  <desc id="desc">計画支出曲線と45度線の交点で均衡産出量が決まり、自律的需要の増加が乗数効果で産出量を増やす図。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fbe"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="920" height="920" fill="#ffffff"/>
  <rect x="52" y="42" width="816" height="792" rx="14" fill="#f8fafc" stroke="#d9e0ea"/>

  <g font-family="Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif">
    <text x="92" y="86" font-size="26" font-weight="700" fill="#20242a">ケインジアン・クロス</text>
    <text x="92" y="115" font-size="17" fill="#586579">計画支出曲線と45度線の交点で短期の均衡産出量が決まる</text>
  </g>

  <g stroke="#344054" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M 110 780 H 760"/>
    <path d="M 110 780 V 130"/>
  </g>

  <g font-family="Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif" fill="#344054">
    <text x="745" y="812" font-size="18">Y</text>
    <text x="72" y="146" font-size="18">PE</text>
  </g>

  <!-- Equal axis scales: PE = Y; PE_0 = 120 + 0.54 Y; PE_1 = 225 + 0.54 Y. -->
  <g fill="none" stroke-linecap="round">
    <path d="M 110 780 L 742 148" stroke="#697386" stroke-width="3"/>
    <path d="M 110 660 L 760 309" stroke="#2f6fbe" stroke-width="4"/>
    <path d="M 110 555 L 760 204" stroke="#d9792f" stroke-width="4"/>
  </g>

  <g font-family="Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif">
    <text x="750" y="152" font-size="17" fill="#697386">45度線</text>
    <text x="768" y="314" font-size="18" fill="#2f6fbe" font-weight="700">PE_0</text>
    <text x="768" y="209" font-size="18" fill="#d9792f" font-weight="700">PE_1</text>
  </g>

  <g stroke="#98a2b3" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <path d="M 370.870 519.130 V 780"/>
    <path d="M 110 519.130 H 370.870"/>
    <path d="M 599.130 290.870 V 780"/>
    <path d="M 110 290.870 H 599.130"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="370.870" cy="519.130" r="7" fill="#2f6fbe"/>
    <circle cx="599.130" cy="290.870" r="7" fill="#d9792f"/>
  </g>

  <g font-family="Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif">
    <text x="332.870" y="495.130" font-size="17" fill="#2f6fbe" font-weight="700">E_0</text>
    <text x="561.130" y="266.870" font-size="17" fill="#d9792f" font-weight="700">E_1</text>
    <text x="348.870" y="808" font-size="17" fill="#2f6fbe">Y_0</text>
    <text x="577.130" y="808" font-size="17" fill="#d9792f">Y_1</text>
  </g>

  <g stroke="#2f6fbe" stroke-width="3" fill="none" marker-end="url(#arrowBlue)">
    <path d="M 388.870 820 H 581.130"/>
  </g>
  <g font-family="Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif">
    <text x="398" y="872" font-size="17" fill="#2f6fbe" font-weight="700">乗数効果：ΔY &gt; ΔG</text>
  </g>

</svg>
