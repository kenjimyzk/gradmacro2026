<text class="small" x="67.0000" y="725.0000" >注：両図は同じ軸尺度。変更前 r̃ = −0.5%ポイント、変更後 −1.5%ポイント（1%ポイント低下）。</text>
<text class="small" x="67.0000" y="756.0000" >橙の矢印は所得固定のシフト、紫の矢印は新PE曲線上の移動。効果の数値は消費の縦方向の増分。</text>
