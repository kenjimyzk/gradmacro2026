<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">TANKのNew Keynesian Cross</title>
  <desc id="desc">TANKでは直接効果が小さいがPE曲線が急になるため、標準領域で所得フィードバックが総効果を増幅しうることを、正確な旧均衡と新均衡を用いて示す図。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#34495e"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2937; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #566273; }
      .axis { stroke: #34495e; stroke-width: 2.4; marker-end: url(#arrow); }
      .grid { stroke: #d8dee8; stroke-width: 1; }
      .line45 { stroke: #697386; stroke-width: 3; fill: none; }
      .peR { stroke: #2f6fbe; stroke-width: 3.5; fill: none; stroke-dasharray: 8 7; }
      .peT { stroke: #379b55; stroke-width: 4; fill: none; }
      .peT2 { stroke: #379b55; stroke-width: 4; fill: none; stroke-dasharray: 10 7; }
      .direct { stroke: #d9792f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .total { stroke: #8d5ab8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #20242a; }
      .text { font: 400 15px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #34495e; }
      .math { font: 600 18px "Times New Roman", serif; fill: #20242a; }
      .note { font: 400 14px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #566273; }
      .box { fill: #ffffff; stroke: #c9d3df; stroke-width: 1.6; rx: 8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1100" height="620" fill="#ffffff"/>
  <rect x="44" y="34" width="1012" height="540" rx="18" fill="#f8fafc" stroke="#d9e0ea"/>
  <text class="title" x="74" y="82">TANK の New Keynesian Cross</text>
  <text class="subtitle" x="76" y="112">Type Sだけが利子率に反応するが、Type Hの現在所得消費がPE曲線を急にする</text>

  <line class="grid" x1="150" y1="430" x2="930" y2="430"/>
  <line class="grid" x1="150" y1="350" x2="930" y2="350"/>
  <line class="grid" x1="150" y1="270" x2="930" y2="270"/>
  <line class="axis" x1="150" y1="510" x2="960" y2="510"/>
  <line class="axis" x1="150" y1="510" x2="150" y2="150"/>

  <path class="line45" d="M150 510 L870 150"/>
  <path class="peR" d="M150 420 L870 348"/>
  <path class="peT" d="M150 445 L870 229"/>
  <path class="peT2" d="M150 400 L870 184"/>

  <!-- 旧所得を固定した垂直移動、その後の新PE曲線上の所得フィードバック -->
  <path class="direct" d="M475 347.5 L475 302.5"/>
  <path class="total" d="M475 302.5 L700 235"/>

  <circle cx="475" cy="347.5" r="7" fill="#379b55" stroke="#ffffff" stroke-width="2"/>
  <circle cx="700" cy="235" r="7" fill="#8d5ab8" stroke="#ffffff" stroke-width="2"/>

  <text class="label" x="500" y="558">所得 y</text>
  <text class="label" x="78" y="146">計画消費 c</text>
  <text class="text" x="750" y="170">45度線</text>
  <text class="math" x="820" y="238">PE<tspan baseline-shift="sub" font-size="13">T</tspan>(r)</text>
  <text class="math" x="820" y="190">PE<tspan baseline-shift="sub" font-size="13">T</tspan>(r↓)</text>
  <text class="math" x="770" y="352">PE<tspan baseline-shift="sub" font-size="13">R</tspan></text>
  <text class="note" x="491" y="331" fill="#d9792f">直接効果</text>
  <text class="note" x="555" y="292" fill="#8d5ab8">所得フィードバック</text>
  <text class="note" x="425" y="371">旧均衡</text>
  <text class="note" x="710" y="268">新均衡</text>

  <rect class="box" x="194" y="152" width="455" height="104"/>
  <text class="math" x="216" y="190">ω<tspan baseline-shift="sub" font-size="13">T</tspan> = [1−β(1−λχ)]/[1−βp(1−λχ)]</text>
  <text class="text" x="216" y="222">標準領域 0 &lt; λχ &lt; 1 では、χが大きいほどPE曲線は急になる</text>
</svg>
